
name: TodoList CI/CD Pipeline

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  ci:
    name: Build, Scan and Push to ECR
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Build Docker image
      - name: Build Docker image
        run: docker build -t todolist:latest .

      # Step 3: Security scan
      - name: Scan Docker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: todolist:latest
          format: table
          exit-code: '0'
          severity: CRITICAL,HIGH

      # Step 4: Debug GitHub OIDC identity
      - name: Debug GitHub OIDC identity
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );
            console.log('OIDC audience:', payload.aud);
            console.log('OIDC subject:', payload.sub);
            console.log('OIDC issuer:', payload.iss);

      # Step 5: Authenticate with AWS
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::777724728429:role/GitHubActions-TodoList-ECR
          aws-region: us-west-2

      # Step 6: Log in to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Step 7: Push Docker image to ECR
      - name: Tag and push Docker image
        run: |
          docker tag todolist:latest 777724728429.dkr.ecr.us-west-2.amazonaws.com/todolist:latest
          docker push 777724728429.dkr.ecr.us-west-2.amazonaws.com/todolist:latest

